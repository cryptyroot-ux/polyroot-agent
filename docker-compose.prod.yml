# =============================================================================
# PRODUCTION STAGING DOCKER COMPOSE CONFIGURATION
# IMPORTANT SECURITY NOTICE:
# Sensitive secrets such as WALLET_PRIVATE_KEY, POSTGRES_PASSWORD, and OWNER_API_KEY
# MUST be supplied securely via an external secret manager (e.g., Docker Secrets,
# Vault, AWS Secrets Manager) or environment variables injected at runtime.
# NEVER commit raw private keys or production secrets to version control.
# =============================================================================
version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: polyroot-prod-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_postgres_password}
      POSTGRES_DB: polyroot_prod
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - polyroot_prod_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polyroot_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - polyroot-prod-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: polyroot-prod-agent
    command:
      ["node", "src/pm/runtime/dist/cli.js", "--mode", "${RUNTIME_MODE:-PAPER}"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-secure_postgres_password}@postgres:5432/polyroot_prod
      KMS_KEY_ID: ${KMS_KEY_ID:-local-dev-key}
      RUNTIME_MODE: ${RUNTIME_MODE:-PAPER}
      WALLET_PRIVATE_KEY: ${WALLET_PRIVATE_KEY:-}
      WALLET_ADDRESS: ${WALLET_ADDRESS:-}
      WALLET_ACCOUNT: ${WALLET_ACCOUNT:-}
      WALLET_FUNDER: ${WALLET_FUNDER:-}
      CHAIN_ID: ${CHAIN_ID:-137}
      RPC_URL: ${RPC_URL:-https://polygon-rpc.com}
      POLYROOT_METRICS_OWNER_KEY: ${POLYROOT_METRICS_OWNER_KEY:-}
      POLYROOT_METRICS_HOST: "0.0.0.0"
      POLYROOT_METRICS_PORT: 9090
      POLYROOT_FORECAST_PROVIDER: ${POLYROOT_FORECAST_PROVIDER:-none}
      POLYROOT_FORECAST_MODEL: ${POLYROOT_FORECAST_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - polyroot-prod-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
    restart: unless-stopped

volumes:
  polyroot_prod_pgdata:

networks:
  polyroot-prod-network:
    driver: bridge
