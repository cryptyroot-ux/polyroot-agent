services:
  postgres:
    image: postgres:16-alpine
    container_name: polyroot-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: polyroot_dev
    ports:
      - "5432:5432"
    volumes:
      - polyroot_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - polyroot-network

  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: polyroot-agent
    command:
      ["node", "src/pm/runtime/dist/cli.js", "--mode", "${RUNTIME_MODE:-PAPER}"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/polyroot_dev
      KMS_KEY_ID: ${KMS_KEY_ID:-local-dev-key}
      RUNTIME_MODE: ${RUNTIME_MODE:-PAPER}
      WALLET_PRIVATE_KEY: ${WALLET_PRIVATE_KEY:-}
      WALLET_ADDRESS: ${WALLET_ADDRESS:-}
      WALLET_ACCOUNT: ${WALLET_ACCOUNT:-}
      WALLET_FUNDER: ${WALLET_FUNDER:-}
      POLYROOT_METRICS_OWNER_KEY: ${POLYROOT_METRICS_OWNER_KEY:-}
      POLYROOT_METRICS_HOST: "0.0.0.0"
      POLYROOT_METRICS_PORT: 9090
      POLYROOT_FORECAST_PROVIDER: ${POLYROOT_FORECAST_PROVIDER:-none}
      LOG_LEVEL: debug
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - polyroot-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
    restart: unless-stopped

  strategy-worker:
    build:
      context: .
      dockerfile: Dockerfile.strategy
    container_name: polyroot-strategy-worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/polyroot_dev
      STRATEGY_RPC_ENDPOINT: unix:///run/strategy/strategy.sock
    volumes:
      - strategy-socket:/run/strategy
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - polyroot-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    restart: unless-stopped

  # Optional: pgAdmin for dev
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: polyroot-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@polyroot.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - polyroot-network
    profiles:
      - tools

volumes:
  polyroot_pgdata:
  strategy-socket:

networks:
  polyroot-network:
    driver: bridge
  polyroot-internal:
    driver: bridge
    internal: true
