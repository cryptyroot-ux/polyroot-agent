name: Polyroot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # Weekly on Monday

env:
  NODE_VERSION: "24"
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/polyroot_test

permissions:
  contents: read
  actions: read
  id-token: write
  checks: write
  issues: write

jobs:
  # ─── Build ───
  build:
    name: Build (all workspaces)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build all
        run: npm run build:all

      - name: Generate build metadata
        id: metadata
        run: |
          echo "tag=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            **/dist
            !**/node_modules/**
          retention-days: 30

  # ─── Validate ───
  validate:
    name: Validate (lint, typecheck, format)
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npx prettier --check .

      - name: Traceability gate (PRD↔Blueprint 96 IDs, P12.1)
        run: npm run traceability

  # ─── Dependency Security Scan ───
  deps-security:
    name: Dependency Security Scan (npm audit, sbom)
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level moderate --json > npm_audit.json || echo "Audit found issues"
        continue-on-error: true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit
          path: npm_audit.json
          retention-days: 30

  # ─── Unit & Contract Tests ───
  test:
    name: Unit & Contract Tests
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: polyroot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 1
          done

      - name: Run migrations
        run: npm run migrate:latest
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run migration smoke tests
        run: npm run test:migration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run unit tests
        run: npm run test:unit

      - name: Run contract tests
        run: npm run test:contract

  # ─── Property-based Tests ───
  property-test:
    name: Property-based Tests
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./

      - name: Install dependencies
        run: npm ci

      - name: Run property tests
        run: npm run test:property

  # ─── Security Scan ───
  security:
    name: Security Scan (Gitleaks + SBOM + Trivy)
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks (no-git with baseline)
        run: |
          gitleaks detect --source . --no-git --baseline-path .gitleaks_baseline.json --verbose --redact --exit-code 1

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scan
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: polyroot/trader:dev
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner on Dockerfile
        run: |
          trivy fs --severity HIGH,CRITICAL --exit-code 1 .
          trivy image --severity HIGH,CRITICAL --exit-code 1 polyroot/trader:dev

  # ─── Docker Build ───
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: polyroot/trader:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker image smoke test
        run: |
          docker run --rm polyroot/trader:dev node --version
          docker run --rm polyroot/trader:dev npm --version
          docker run --rm polyroot/trader:dev echo "Smoke test passed"

  # ─── Release Manifest ───
  manifest:
    name: Generate Release Manifest
    runs-on: ubuntu-latest
    needs: [build, docker, validate, test, property-test, security]
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./

      - name: Install dependencies
        run: npm ci

      - name: Build workspaces
        run: npm run build:all

      - name: Generate manifest
        id: manifest
        run: |
          node scripts/generate-manifest.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release_manifest.json
          retention-days: 365

      - name: Verify manifest schema
        run: |
          npx --yes ajv-cli validate --spec=draft2020 --validate-formats=false -s release_manifest.schema.json -d release_manifest.json

  # ─── Coverage Gate ───
  coverage:
    name: Test Coverage Gate
    runs-on: ubuntu-latest
    needs: [build, test]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./

      - name: Install dependencies
        run: npm ci

      - name: Run coverage gate
        run: npm run coverage:gate

  # ─── Notify ───
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs:
      [
        validate,
        test,
        property-test,
        security,
        build,
        docker,
        manifest,
        coverage,
      ]
    if: failure()
    timeout-minutes: 10
    steps:
      - name: Send failure notification
        run: |
          echo "Workflow failed. Check GitHub Actions for details."
          # Add Slack/Discord/email webhook here if configured

# Concurrency control to avoid overlapping runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
